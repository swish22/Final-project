# Pilot: one hour per day from the 14 learning days, used to check the pipeline in a few minutes.
# The real test days (14-16) are never read with this config.
paths:
  index: ../bitcoin4_5_first17d_urls_and_format/bitcoin4_first17d_index.csv
  parquet_dir: data/parquet
  output_dir: output/pilot
sample:
  per_day: 12
split:
  train:
  - 0
  - 7
  val:
  - 8
  - 10
  test:
  - 11
  - 13
refit_on_learning_days: true
workers: 6
latency:
  scenarios:
  - 0
  - 1
  robustness:
  - 2
  - 5
spot:
  proxy: mean
  proxy_grid:
  - coinbase
  - binance
  - mean
basis:
  enabled: false
vol:
  half_life_s: 300
  sigma_scale: 1.5
  half_life_grid:
  - 60
  - 120
  - 300
  - 600
  - 1200
  - 2400
  sigma_scale_grid:
  - 1
  - 1.25
  - 1.5
  - 1.75
  - 2
  - 2.5
quote:
  objective: sharpe
  min_shares_per_market: 50
  size: 10
  inv_cap: 100
  h_min_grid:
  - 0.01
  - 0.02
  - 0.05
  kappa_grid:
  - 0
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  gamma_grid:
  - 0
  - 0.00025
  - 0.0005
  - 0.001
  - 0.002
  - 0.004
  tau_stop_grid:
  - 15
  - 30
  - 60
  - 120
  variants:
    D1sel:
      model: D1
      min_shares_per_market: 5
  params: {}
model:
  clip_lo: 0.005
  clip_hi: 0.995
  logistic_C: 1
models:
  scored:
  - G0
  - market
  - G1
  - D1
  - D2
  - D3
  quoted:
  - market
  - G1
  - D1
risk:
  cvar_alpha: 0.05
validation:
  max_offset_iqr_ms: 50
  max_strike_delay_s: 60
  min_lead_s: 60
  max_no_book_frac: 0.05
  max_book_gap_s: 60
  max_spot_missing_frac: 0.01
frozen: false
